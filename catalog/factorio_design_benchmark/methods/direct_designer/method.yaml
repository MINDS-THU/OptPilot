apiVersion: optpilot.io/v1
config: method
id: direct-designer
description: >-
  The benchmark's Direct baseline: one LLM proposes a complete production
  line per trial, then revises it using the previous trial's validation
  outcome. Prompts are assembled from the environment's own instructions,
  schema description, candidate template and the 22 validation rules, so the
  method carries no Factorio knowledge of its own and works against any
  file-candidate environment that supplies those references. Set
  settings.mode to seed for a deterministic, zero-LLM run (used by the smoke
  study and CI); set it to llm to call a model.
tags: [llm, factorio, factory-design, baseline, files, one-shot-per-trial]

entrypoint:
  python: method:DirectDesignerMethod
  pythonPath: ["."]
  protocol: batch
  exchangeTimeoutSeconds: 900

accepts:
  formats: [files]
  requires:
    context:
      - methodContext.instructions
      - methodContext.references

settings:
  batchSize: 1
  mode: seed
  model: deepseek/deepseek-chat
  baseUrl: https://openrouter.ai/api/v1
  temperature: 0.0
  maxOutputTokens: 8000
  requestTimeoutSeconds: 600

settingsSchema:
  batchSize:
    valueType: int
    min: 1
    max: 4
    default: 1
    description: Designs proposed per trial. The paper's Direct baseline uses 1.
  mode:
    valueType: categorical
    values: [seed, llm]
    default: seed
    description: >-
      seed emits the environment's candidate template unchanged (deterministic,
      no network, used for smoke runs); llm calls the configured model.
  model:
    valueType: string
    default: deepseek/deepseek-chat
    description: Model id passed to the OpenAI-compatible chat completions API.
  baseUrl:
    valueType: string
    default: https://openrouter.ai/api/v1
    description: OpenAI-compatible API base URL.
  temperature:
    valueType: float
    min: 0.0
    max: 2.0
    default: 0.0
    description: Sampling temperature. The baseline uses 0.
  maxOutputTokens:
    valueType: int
    min: 256
    max: 32000
    default: 8000
    description: Output token ceiling for one design.
  requestTimeoutSeconds:
    valueType: float
    min: 10.0
    max: 900.0
    default: 600.0
    description: Per-request timeout for the model call.

runtime:
  sandbox: process
  envFromHost: [OPENROUTER_API_KEY]
