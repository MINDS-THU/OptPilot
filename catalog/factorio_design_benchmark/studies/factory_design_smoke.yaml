apiVersion: optpilot.io/v1
config: study
name: factory-design-smoke
description: >-
  Deterministic one-trial run of the Factorio static validator through the
  retained pipeline. The Direct designer runs in seed mode, so no model is
  called and no network is needed - this is the CI smoke for the package.
environmentConfig: ../environments/factory_design/environment.yaml
methodConfig: ../methods/direct_designer/method_seed.yaml
inputs:
  task_id:
    valueType: string
    default: iron_gear_low_easy
    description: >-
      Benchmark task id to validate against. Any of the 32 ids under
      environments/factory_design/fd_core/tasks/configs/.

objective:
  metric: failed_check_count
  direction: minimize
budget:
  maxTrials: 1
execution:
  parallelism: 1
  timeoutSeconds: 900
reproducibility:
  seed: 7
