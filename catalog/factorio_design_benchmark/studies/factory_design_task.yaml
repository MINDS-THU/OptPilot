apiVersion: optpilot.io/v1
config: study
name: factory-design-task
description: >-
  Design a factory for one benchmark task with the Direct baseline, revising
  from each trial's validation verdict. The task is chosen at launch, so this
  one Run setup covers all 32 tasks: pass --input task_id=<id> (or fill the
  Launch inputs form in Studio). Requires a model; use factory-design-smoke
  for a zero-LLM run.
environmentConfig: ../environments/factory_design/environment.yaml
methodConfig: ../methods/direct_designer/method_llm.yaml

inputs:
  task_id:
    valueType: string
    default: iron_gear_low_easy
    description: >-
      Benchmark task id, e.g. iron_gear_low_easy, electronic_circuit_high_hard,
      military_science_pack_low_easy. Selects target product, target rate, map
      size, ore and water patches. The full list is in
      environments/factory_design/fd_core/tasks/configs/.

objective:
  metric: failed_check_count
  direction: minimize

budget:
  maxTrials: 25

execution:
  parallelism: 1
  timeoutSeconds: 1800

reproducibility:
  seed: 7
