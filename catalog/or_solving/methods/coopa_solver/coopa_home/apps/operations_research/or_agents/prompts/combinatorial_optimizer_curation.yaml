managed_agent:
  task: |-
      You're a helpful agent named '{{name}}' working on a subtask your manager delegated to you:
      ---
      Task:
      {{task}}
      ---
      Proceed as you normally would — using Thought, Code — and when ready, respond using the `final_answer` tool with all required components (summary, details, context).

      **FIRST STEP (do this only once)**: Your very first code block should save all problem parameters to a JSON file using `create_file_with_content()`. Extract every numerical parameter, set, index, bound, and coefficient from the problem description and persist them as structured JSON before doing anything else. This ensures parameters are captured accurately and can be referenced by subsequent steps. If you have already created parameters.json successfully in a previous step, do NOT recreate it — skip directly to the next step (building the solver model).

      **PROGRESS TRACKING**: After each successful step, note what you have completed. Never repeat a step that already succeeded. The typical progression is: (1) Create parameters.json, (2) Build and save solver code to solve.py, (3) Execute the solver via load_object_from_python_file — then STOP and wait for the result, (4) In a NEW separate code block, pass the result to code_review, (5) Call final_answer. Steps 3 and 4 must ALWAYS be in separate code blocks — never call code_review in the same code block as load_object_from_python_file.

      **CRITICAL FILE PATH RULE**: The parameters.json file is NOT in the local working directory. When loading parameters.json (or any generated file), you MUST resolve the path relative to the current script's location, NOT assume it is in the current working directory. Always use:
      ```python
      import os
      current_dir = os.path.dirname(os.path.abspath(__file__))
      json_path = os.path.join(current_dir, "parameters.json")
      ```
      Do NOT use `open("parameters.json")` or any relative path directly. This applies to every file you create or read throughout your workflow.

      **CRITICAL WORKFLOW RULE**: Place every step in your workflow in its OWN SEPARATE code block. Do NOT combine multiple steps (e.g., parameter extraction, model building, solving, result analysis) into a single code block. Each code block should do exactly one thing. This ensures you can verify the output of each step before proceeding to the next, and prevents cascading errors from unverified intermediate results.

      **CRITICAL FINAL ANSWER RULE**: When calling `final_answer`, the objective value you return MUST be a single scalar number (int or float), NOT a tuple, list, or any other compound type. For example, return `objective_value` not `(objective_value, status)`. If you need to include additional information (e.g., solver status, variable values), put them in the `details` or `context` fields — the primary result must be a single numeric value.

      **CRITICAL STOPPING RULE**: After writing ```<end_code>, you MUST STOP. Do NOT write anything more.
      - Do NOT simulate or fabricate execution output after your code block.
      - Do NOT hallucinate file contents, print output, or solver results.
      - Do NOT start the next Thought. Wait for the system to execute your code and return the result.
      - If you catch yourself writing output after ```<end_code>, STOP — you are hallucinating.

      **CRITICAL EXECUTION RULE**: After creating solve.py, your VERY NEXT code block MUST call `load_object_from_python_file("solve.py", "solve_problem")` to execute the solver. This step is NON-NEGOTIABLE and CANNOT be skipped under any circumstances.
      - You MUST NOT call `final_answer()` without first having successfully executed the solver via `load_object_from_python_file()` and received actual output.
      - If you have NOT called `load_object_from_python_file()` and received real execution results, you have NOT solved the problem — do NOT fabricate or guess the answer.

      **CRITICAL ERROR HANDLING RULE**: If `load_object_from_python_file()` returns an error or exception:
      1. You MUST pass the FULL error message to `code_review(error_message)` in a NEW SEPARATE code block so the error can be diagnosed.
      2. Based on code_review feedback, fix the code in solve.py using `create_file_with_content()`.
      3. Re-execute with `load_object_from_python_file()` again.
      4. Repeat until execution succeeds, then pass the successful result to `code_review()`.
      - You MUST NEVER call `final_answer()` with fabricated results when execution has failed. The error MUST go through `code_review()` for diagnosis and fixing.
      - You MUST NEVER skip the error-fix-reexecute cycle and jump to `final_answer()`.

  report: |-
      Here is the final answer from your managed agent '{{name}}':
      {{final_answer}}

      This concludes the subtask. You must now use this information to provide your own final_answer and STOP.

final_answer:
  pre_messages: |-
    An agent tried to answer a user query but it got stuck and failed to do so. You are tasked with providing an answer instead. Here is the agent's memory:
  post_messages: |-
    Based on the above, please provide an answer to the following user task:
    {{task}}

    **CRITICAL: DO NOT FABRICATE RESULTS.** Before answering, check the agent's memory above:
    - Was `load_object_from_python_file()` ever called AND did it return actual solver output (not an error)?
    - If YES: Use ONLY those actual solver results for your answer.
    - If NO (solver was never executed, or execution failed with an error): You MUST report `Status: error` and `Objective: N/A`. Explain that the solver was not successfully executed. Do NOT guess, reason about, or calculate what the answer might be. Do NOT fabricate variable values, objective values, or routes.

    Format your answer as a multiline string with the following sections, clearly labeled and easy to parse:

    Status: <solver status — e.g., "optimal", "feasible", "infeasible", "error">
    Objective: <objective value, or "N/A" if not applicable>
    Variables:
        <var_name_1>: <value>
        <var_name_2>: <value>
        ...
    Notes:
        <any relevant modeling observations, solver messages, or warnings>
    Files:
        <filename_1>: <brief description of what the file contains, e.g., 'OR-Tools model and solver script'>
        <filename_2>: <brief description, e.g., 'Solution output (routes, schedules, assignments, etc.)'>
        ...

    Example:
    ```py
    final_answer("""  
    Status: optimal  
    Objective: 1275  
    Variables:  
        route[0]: [0, 3, 5, 0]  
        route[1]: [0, 2, 4, 0]  
        total_distance: 1275  

    Notes:  
        The solver found an optimal solution for the vehicle routing problem.  
        All time window and capacity constraints were satisfied.  

    Files:  
        vrp_model.py: OR-Tools model definition and solver script  
        vrp_solution.txt: Vehicle routes and arrival times  
    """)
    ```<end_code>