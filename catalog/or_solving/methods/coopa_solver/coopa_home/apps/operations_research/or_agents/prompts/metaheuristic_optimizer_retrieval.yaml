    ```py
    import numpy as np
    import json, re
    from pymoo.core.problem import Problem
    from pymoo.algorithms.moo.nsga2 import NSGA2
    from pymoo.optimize import minimize
    from pymoo.termination import get_termination

    # Read current problem data
    raw = see_file(filename="current_problem_data.json")
    cleaned = "\n".join(re.sub(r"^\s*\d+:\s*", "", line) for line in raw.splitlines())
    data = json.loads(cleaned)

    # Define problem class for current 3-objective optimization
    class ProjectOptimization(Problem):
        def __init__(self, data):
            self.data = data
            super().__init__(
                n_var=15,  # design variables
                n_obj=3,   # minimize cost, time, and maximize quality
                n_constr=5,  # resource and precedence constraints
                xl=np.array(data["lower_bounds"]),
                xu=np.array(data["upper_bounds"])
            )

        def _evaluate(self, x, out, *args, **kwargs):
            # Objective 1: Total cost
            f1 = np.sum(x * self.data["cost_coefficients"])

            # Objective 2: Project duration
            f2 = np.max([x[i] * self.data["time_factors"][i] for i in range(15)])

            # Objective 3: Quality score (minimize negative to maximize quality)
            f3 = -np.sum(x * self.data["quality_coefficients"]) / 15

            out["F"] = np.column_stack([f1, f2, f3])

            # Constraints
            g1 = np.sum(x[:5]) - self.data["budget_limit"]  # budget constraint
            g2 = np.sum(x[5:10] * self.data["resource_usage"]) - self.data["resource_capacity"]
            g3 = x[3] - x[7]  # precedence: task 7 must follow task 3
            g4 = x[2] - x[8]  # precedence: task 8 must follow task 2
            g5 = np.sum(x) - self.data["total_capacity"]

            out["G"] = np.column_stack([g1, g2, g3, g4, g5])

    # Create and solve
    problem = ProjectOptimization(data)
    algorithm = NSGA2(pop_size=100, eliminate_duplicates=True)
    termination = get_termination("n_gen", 200)
    result = minimize(problem, algorithm, termination, verbose=False)

    print(f"Number of Pareto-optimal solutions: {len(result.X)}")
    print(f"\nSample Pareto solutions:")
    for i in range(min(3, len(result.X))):
        print(f"  Solution {i+1}:")
        print(f"    Variables (first 5): {result.X[i][:5]}")
        print(f"    Cost: {result.F[i][0]:.2f}, Time: {result.F[i][1]:.2f}, Quality: {-result.F[i][2]:.3f}")
    ```<end_code>

