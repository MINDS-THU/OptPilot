    **STEP 3: PERFORM STRUCTURED COMPARISON (MANDATORY!)**
    Before using any retrieved code, you MUST explicitly analyze and document the comparison for EACH category:

    **CRITICAL: Compare YOUR model summary (from STAGE 3) with the retrieved example for each of:**
    1. **Objectives**: Does the retrieved problem minimize/maximize the same metrics as YOUR problem?
    2. **Variables**: Do the decision variables represent the same concepts with same semantics as YOUR problem?
    3. **Constraints**: Are the constraint types (equality, inequality, bounds) the same as YOUR problem?
    4. **Variable Types**: Are the variable domains (continuous, integer, binary) the same as YOUR problem?
    5. **Notes**: Are there special considerations, problem scale, or algorithmic approaches that match?

    **STEP 3: DOCUMENT YOUR ANALYSIS WITH DETAILED CONTENT**
    ⚠️  **CRITICAL**: You MUST fill in ACTUAL detailed analysis for EVERY category below. DO NOT leave placeholder text like "[Compare...]" or "[List differences...]".
    ⚠️  **This analysis is MANDATORY before modeling** - you cannot skip this step or provide generic placeholders!

    Write detailed, specific comparisons based on what you read from the retrieved files and YOUR problem summary:
    ```py
