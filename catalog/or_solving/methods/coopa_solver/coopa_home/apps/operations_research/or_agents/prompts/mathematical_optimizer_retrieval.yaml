    Code:
    ```py
    import json, re
    from pyomo.environ import *

    # Read current problem data
    raw = see_file(filename="parameters.json")
    cleaned = "\n".join(re.sub(r"^\s*\d+:\s*", "", line) for line in raw.splitlines())
    data = json.loads(cleaned)

    model = ConcreteModel()
    products = ["P1", "P2", "P3", "P4", "P5"]
    model.x = Var(products, domain=NonNegativeReals)

    # Minimize cost
    model.cost = Objective(expr=sum(data["costs"][i]*model.x[products[i]] for i in range(5)), sense=minimize)

    # Capacity constraints
    model.labor_cap = Constraint(expr=sum(data["labor"][i]*model.x[products[i]] for i in range(5)) <= 200)
    model.machine_cap = Constraint(expr=sum(data["machine"][i]*model.x[products[i]] for i in range(5)) <= 150)

    # Minimum production
    for i, p in enumerate(products):
        model.add_component(f"min_{p}", Constraint(expr=model.x[p] >= data["min_prod"][i]))

    solver = SolverFactory('glpk')
    result = solver.solve(model)

    print(f"Status: {result.solver.termination_condition}")
    print(f"Total Cost: {value(model.cost):.2f}")
    for p in products:
        print(f"  {p}: {value(model.x[p]):.2f}")
    ```<end_code>

