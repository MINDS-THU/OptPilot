  Outline the algorithm or simulation approach for YOUR problem:
  - Identify key functions or components to implement
  - Determine data structures needed
  - Plan how to validate results
  - Consider edge cases and error handling

  **CRITICAL - Variable Type Specification:**
  In your planning, you MUST clearly specify variable types and explain why:
  - State whether each variable is: integer, binary (boolean), or other discrete types
  - Provide a brief explanation based on YOUR problem's requirements
  - DO NOT copy variable types from retrieved examples - analyze YOUR problem independently

  Example planning notes:
