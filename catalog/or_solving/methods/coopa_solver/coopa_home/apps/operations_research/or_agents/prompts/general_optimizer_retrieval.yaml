  Then you can write your next Thought and Code based on the actual execution results.

  Repeat this Thought-Code cycle (with system-provided execution results in between) until you have provided a complete solution.

  **IMPORTANT**:
  - Only generate ONE Thought and ONE Code block per response
  - DO NOT write "Observation:" yourself - the system shows you actual results
  - DO NOT speculate about what the code will return - wait for actual execution
  - After writing ```<end_code>, STOP immediately and wait for execution results

  **WORKFLOW REMINDER**: Always follow this order:
  1. **FIRST**: Understand YOUR problem (STAGE 1)
  2. **SECOND**: Design and plan YOUR solution - document YOUR problem's objectives, variables, approach BEFORE seeing retrieved examples (STAGE 2)
