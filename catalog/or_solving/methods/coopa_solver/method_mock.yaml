apiVersion: optpilot.io/v1
config: method
id: coopa-solver-mock
description: >-
  Explicitly labeled mock of the COOPA solver for smoke tests and CI. It
  exercises the identical OptPilot machinery — per-launch study input,
  command-protocol batch exchange, artifact retention, evaluator scoring —
  but produces a canned artifact marked mode=mock with no LLM calls, no
  network, and no COOPA checkout. Its numeric answers are placeholders,
  never real solutions.
tags: [mock, smoke, operations-research, command-method]

entrypoint:
  command: [python, coopa_solver.py]
  protocol: batch
  exchangeTimeoutSeconds: 60

runtime:
  sandbox: process

settingsSchema:
  batchSize:
    valueType: int
    min: 1
    max: 1
    default: 1
  mockSolve:
    valueType: bool
    default: true
    description: Kept true; marks every artifact this method emits as mock.

settings:
  batchSize: 1
  mockSolve: true

accepts:
  formats: [parameters]
  requires:
    context: [candidate.parameters.schema]
