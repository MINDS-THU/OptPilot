apiVersion: optpilot.io/v1
config: method
id: coopa-solver
description: >-
  Solves one natural-language OR problem per Run using the COOPA pipeline:
  confidence-scored formulation extraction, routing to a mathematical /
  combinatorial / metaheuristic / general optimizer agent, LLM-generated
  solver code executed locally, and a numeric answer. Requires a
  user-provisioned COOPA checkout (COOPA_HOME) and its pruned runtime
  dependencies; COOPA is not redistributed with this package. To solve one
  problem as a person, launch the solve-or-problem Run setup and enter the
  problem in its launch-inputs form; the answer and full audit artifact
  come back as retained Run evidence.
tags: [llm, operations-research, one-time-solve, command-method]

entrypoint:
  command: [python, coopa_solver.py]
  protocol: batch
  # One solve can include formulation refinement plus agent tool loops.
  exchangeTimeoutSeconds: 900

interface:
  label: COOPA Solve Console
  description: >-
    Interactive one-shot solving with formulation review: extract a
    confidence-scored formulation with element provenance, approve it or
    request revisions, then watch the optimizer agents generate solver code
    and the numeric answer. An automatic mode runs the whole pipeline
    unattended, and a mock mode demos the console without COOPA or network.
    Inside Studio's launch runtime the host COOPA_HOME path is not visible;
    place a COOPA checkout at methods/coopa_solver/coopa_home (gitignored,
    never redistributed) before launching.
  command: [bash, ./launch_console.sh]
  cwd: .
  runtime:
    sandbox: process
    setup:
      cache: prepared
      timeoutSeconds: 1800
      steps:
        - uses: command
          command: [bash, ./launch_console.sh, --prepare-only]
  grants:
    network: enabled
    envFromHost: [COOPA_HOME]
    secretsFromHost: [OPENROUTER_API_KEY]
  resources:
    cpu: 2
    memoryMiB: 4096
    gpus: 0
  timeoutSeconds: 3600
  presentation:
    kind: web
    port: 8000
    readyPath: /
    readyTimeoutSeconds: 120

runtime:
  sandbox: process
  envFromHost: [OPENROUTER_API_KEY, COOPA_HOME]

settingsSchema:
  batchSize:
    valueType: int
    min: 1
    max: 1
    default: 1
    description: One-shot solve; exactly one proposal per Run.
  model:
    valueType: string
    default: openrouter/deepseek/deepseek-v4-pro
    description: litellm model id used for formulation and all agents.
  agentMode:
    valueType: categorical
    values: [manager, mathematical-only]
    default: manager
    description: >-
      manager routes across all four optimizer agents; mathematical-only
      runs the Pyomo-based mathematical agent directly (covers most
      benchmark dispatches and needs no combinatorial/metaheuristic extras).
  skipFormulation:
    valueType: bool
    default: false
    description: Skip Phase 0 formulation extraction and prompt with raw text.
  maxRefinementIterations:
    valueType: int
    min: 1
    max: 5
    default: 2
    description: Formulation refinement iterations (confidence max-min pick).

settings:
  batchSize: 1

accepts:
  formats: [parameters]
  requires:
    context: [candidate.parameters.schema]
