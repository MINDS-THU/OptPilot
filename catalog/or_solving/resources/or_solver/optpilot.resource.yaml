apiVersion: optpilot.io/v1
config: resource
id: or-solver
name: OR Problem Solver (COOPA)
description: >-
  Human-facing one-shot solver for natural-language operations-research
  problems. The solve action runs the same pruned COOPA pipeline as the
  coopa-solver method — formulation extraction, optimizer-agent routing,
  LLM-generated solver code — and writes the numeric answer plus the full
  audit artifact to the chosen output folder. Requires a user-provisioned
  COOPA checkout (COOPA_HOME) and an OpenRouter API key; neither is bundled.
purpose: generator
tags: [operations-research, llm, one-time-solve]

actions:
  - id: solve
    label: Solve an OR problem
    description: >-
      Solve one natural-language OR problem and write answer.txt (human
      summary), report.json (full artifact, schema
      optpilot.or-solving-report.v1), and the generated solver files under
      the output folder. Set mock to true to smoke-test the plumbing
      without COOPA, network, or API keys.
    command: [python, solve_action.py]
    inputs:
      problem:
        valueType: string
        description: The operations-research problem, stated in natural language.
      model:
        valueType: string
        default: openrouter/deepseek/deepseek-v4-pro
        description: litellm model id used for formulation and all agents.
      agentMode:
        valueType: categorical
        values: [manager, mathematical-only]
        default: manager
        description: >-
          manager routes across all four optimizer agents; mathematical-only
          runs the Pyomo-based mathematical agent directly.
      skipFormulation:
        valueType: bool
        default: false
        description: Skip Phase 0 formulation extraction and prompt with raw text.
      maxRefinementIterations:
        valueType: int
        min: 1
        max: 5
        default: 2
        description: Formulation refinement iterations.
      mock:
        valueType: bool
        default: false
        description: Return a labeled placeholder without running COOPA.
    grants:
      envFromHost: [COOPA_HOME]
      secretsFromHost: [OPENROUTER_API_KEY]
    timeoutSeconds: 3600
