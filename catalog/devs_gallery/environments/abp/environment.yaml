apiVersion: optpilot.io/v1
config: environment
id: abp-protocol
name: "Alternating-bit protocol simulator"
description: >-
  DEVS-Gen generated Alternating Bit Protocol simulator: a sender and
  receiver exchange packets over lossy subnets with deterministic seeded
  noise. Candidates tune protocol timing (most interestingly the sender's
  retransmission timeout); metrics report delivered packets,
  retransmissions, and channel drops. The simulator code is unmodified
  generator output from the DEVS-Gen gallery.
tasks:
  - tune-parameters
  - generate-simulator
tags: [devs, simulation, protocol, generated]

evaluator:
  python: evaluator:evaluate
  pythonPath: ["."]
  settings:
    totalPackets: 20
    simulateTime: 5000.0

runtime:
  sandbox: process
  setup:
    cache: prepared
    timeoutSeconds: 300
    steps:
      - uses: python-venv
        cwd: "."
        requirements: [runtime_dependencies/requirements.lock]

candidate:
  format: parameters
  parameters:
    schema:
      timeout:
        valueType: float
        min: 5.0
        max: 200.0
        default: 20.0
        description: >-
          Sender retransmission timeout (ms). Too short wastes bandwidth on
          spurious retransmissions; too long stalls recovery after a loss.
      sender_delay:
        valueType: float
        min: 1.0
        max: 50.0
        default: 10.0
        description: Sender preparation delay per packet (ms).
      receiver_delay:
        valueType: float
        min: 1.0
        max: 50.0
        default: 10.0
        description: Receiver processing delay per packet (ms).
      channel_delay:
        valueType: float
        min: 0.5
        max: 20.0
        default: 3.0
        description: One-way subnet transmission delay (ms).
      seed:
        valueType: int
        min: 0
        max: 10000
        default: 42
        description: Deterministic noise seed for both lossy subnets.

metrics:
  source: return
  keys: [packets_delivered, retransmissions, forward_dropped, ack_dropped]
