apiVersion: optpilot.io/v1
config: environment
id: queue-demo
description: >-
  Single-server job queue with class-dependent service times and lateness
  penalties. Candidates are executable dispatch policies (scheduler.py);
  the evaluator runs seeded replications, retains the worst replication's
  SQLite trace, and reports aggregate and worst-seed scores. The
  executable instantiation of the bring-your-own-simulator DES template.
tags: [des, queueing, policy-search, template]

evaluator:
  python: evaluator:evaluate
  pythonPath: ["."]
  timeoutSeconds: 600
  settings:
    horizon: 480.0
    meanArrivalGap: 3.0
    seeds: [101, 102, 103, 104, 105]

candidate:
  format: files
  materialize:
    root: candidate
  files:
    editable:
      - path: scheduler.py
    required: [scheduler.py]
    allow: [scheduler.py, "provenance/**"]
    deny: ["**/__pycache__/**", "**/*.pyc"]

methodContext:
  instructions: [prompts/policy_system.md]
  references:
    - name: scheduler.py
      type: candidate_template
      path: templates/scheduler.py
    - name: domain_description
      type: markdown
      path: prompts/domain_description.md
    - name: database_description
      type: markdown
      path: prompts/trace_schema.md
    - name: replay_settings
      type: json
      path: settings/replay.json

capabilities:
  - id: exact_seed_replay
    description: >-
      Replays an executable policy on an exact evaluation seed and
      produces a bounded SQLite trace.
    callable: evaluator:replay_candidate

policyValidation:
  entrypoint:
    file: scheduler.py
    callable: create_scheduler
    maxArguments: 0
  forbiddenImports:
    [builtins, des_replication, evaluator, importlib, os, pathlib,
     simulator, socket, subprocess, sys]
  forbiddenNames: [create_controller]

metrics:
  source: return
  keys:
    [mean_total_score, std_total_score, min_total_score, max_total_score,
     worst_seed, worst_total_score, mean_served, mean_mean_wait,
     mean_weighted_lateness]
