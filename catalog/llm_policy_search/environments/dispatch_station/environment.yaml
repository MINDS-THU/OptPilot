apiVersion: optpilot.io/v1
config: environment
id: dispatch-station
description: >-
  DEVS-Gen generated dispatch station (one machine, quick and heavy jobs
  arriving over an 8-hour shift) whose dispatch decision delegates to an
  editable policy module - the simulator itself declared the hook in its
  devs.simulation.v2 manifest. Candidates are executable policy.py files;
  the evaluator runs seeded replications of the generated simulator,
  converts the worst replication's event trace to SQLite, and reports
  aggregate and worst-seed scores (score = negated average waiting time,
  so higher is better).
tags: [des, devs, dispatching, policy-search, generated]

evaluator:
  python: optpilot_adapter_policy:evaluate
  pythonPath: ["."]
  timeoutSeconds: 900
  settings:
    seeds: [7, 11, 23]
    seedArgument: seed
    scoreMetric: average_waiting_time
    scoreDirection: minimize
    timeoutSeconds: 240

runtime:
  sandbox: process
  setup:
    cache: prepared
    timeoutSeconds: 300
    steps:
      - uses: python-venv
        cwd: simulator
        requirements: [runtime_dependencies/requirements.lock]

trialWorkspace:
  - {from: simulator/run.py, to: simulator/run.py}
  - {from: simulator/simulation.json, to: simulator/simulation.json}
  - {from: simulator/devs_project, to: simulator/devs_project}

candidate:
  format: files
  materialize:
    root: candidate
  files:
    editable:
      - path: policy.py
    required: [policy.py]
    allow: [policy.py, "provenance/**"]
    deny: ["**/__pycache__/**", "**/*.pyc"]

methodContext:
  instructions: [policy_instructions.md]
  references:
    - name: policy.py
      type: candidate_template
      path: simulator/devs_project/policy.py
    - name: replay_settings
      type: json
      path: settings/replay.json

capabilities:
  - id: exact_seed_replay
    description: >-
      Replays the candidate policy on an exact evaluation seed and
      produces a bounded SQLite trace.
    callable: optpilot_adapter_policy:replay_candidate

policyValidation:
  entrypoint:
    file: policy.py
    callable: create_policy
    maxArguments: 0
  forbiddenImports:
    [builtins, importlib, os, pathlib, socket, subprocess, sys]
  forbiddenNames: []

metrics:
  source: return
  keys:
    [mean_total_score, min_total_score, max_total_score, worst_seed,
     worst_total_score]
