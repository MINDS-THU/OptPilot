apiVersion: optpilot.io/v1
config: method
id: llm-policy-search
description: >-
  Trace-aware LLM policy search: a manager and parallel code editors
  iteratively improve executable decision policies from metrics and
  worst-seed process traces. Fully contract-driven - the editable file
  set, policy interface, validation rules, domain wording, and replay
  capability all come from the environment's declarations, so any DES
  environment that publishes the contracts can adopt it unchanged.
tags: [llm, heuristic-design, policy-search, files]

entrypoint:
  python: method:ProcessAwareLLMHeuristicMethod
  pythonPath: [.]
  protocol: batch
  # One exchange can include manager calls, parallel editors, and retries.
  exchangeTimeoutSeconds: 5000

runtime:
  sandbox: process
  envFromHost: [OPENROUTER_API_KEY]

settings:
  batchSize: 4
  candidatesPerIteration: 4
  maxIterations: 5
  patience: 3
  targetScore: 80
  managerQueryRounds: 2
  managerCorrectionAttempts: 2
  maxQueryRows: 20
  maxQueryCellBytes: 4096
  maxQueryResultBytes: 65536
  sqliteLengthLimitBytes: 1048576
  editorRetries: 3
  provider: openrouter
  model: deepseek/deepseek-v4-flash
  temperature: 0.2
  maxTokens: 10000
  requireProviderParameters: true
  allowProviderFallbacks: true
  apiKeyEnvVar: OPENROUTER_API_KEY
  apiBase: https://openrouter.ai/api/v1/chat/completions
  requestTimeoutSeconds: 180
  requestRetries: 2
  retryBaseSeconds: 1.0
  retryMaxSeconds: 8.0
  maxHttpResponseBytes: 4194304
  maxHttpErrorBytes: 65536
  replayTimeoutSeconds: 1800
  maxReplayResultBytes: 1048576
  maxStateCacheBytes: 67108864
  maxProvenanceBytes: 8388608
  maxReferenceBytes: 32000
  maxReferenceFileBytes: 16000

accepts:
  formats: [files]
  requires:
    context:
      - candidate.files.editable
      - candidate.files.allow
      - methodContext.instructions
      - methodContext.references
      - policyValidation
    capabilities: [exact_seed_replay]
