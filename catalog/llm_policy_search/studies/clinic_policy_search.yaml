apiVersion: optpilot.io/v1
config: study
name: clinic-policy-search
description: >-
  Class-style composition measurement: improve the generated triage
  clinic's TriagePolicy component (the whole DEVS component file is the
  editable candidate) with trace-aware LLM policy search over three
  iterations. Requires OPENROUTER_API_KEY.
environmentConfig: ../environments/triage_clinic/environment.yaml
methodConfig: ../methods/llm_policy_search/method.yaml
objective:
  metric: mean_total_score
  direction: maximize
  secondaryMetrics: [min_total_score, worst_total_score]
budget:
  maxTrials: 13
execution:
  parallelism: 2
  timeoutSeconds: 900
evidence:
  level: full
reproducibility:
  seed: 3
