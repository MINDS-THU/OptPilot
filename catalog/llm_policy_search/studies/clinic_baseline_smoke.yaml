apiVersion: optpilot.io/v1
config: study
name: clinic-baseline-smoke
description: >-
  Contract smoke for the generated triage clinic (class-style candidate:
  the TriagePolicy component file itself): one trial stages the baseline
  FIFO component (no LLM calls), runs the seeded replications of the
  DEVS-Gen simulator, and exercises the worst-seed replay.
environmentConfig: ../environments/triage_clinic/environment.yaml
methodConfig: ../methods/llm_policy_search/method.yaml
objective:
  metric: mean_total_score
  direction: maximize
budget:
  maxTrials: 1
execution:
  parallelism: 1
  timeoutSeconds: 900
reproducibility:
  seed: 3
