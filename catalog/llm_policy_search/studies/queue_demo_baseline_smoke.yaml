apiVersion: optpilot.io/v1
config: study
name: queue-demo-baseline-smoke
title: "Queue demo: check the baseline rule runs"
description: >-
  Contract smoke for the DES template: one trial stages the unmodified
  baseline policy (no LLM calls), runs the seeded replications, and
  exercises the worst-seed replay capability end to end.
tags: [smoke]
environmentConfig: ../environments/queue_demo/environment.yaml
methodConfig: ../methods/llm_policy_search/method.yaml
objective:
  metric: mean_total_score
  direction: maximize
budget:
  maxTrials: 1
execution:
  parallelism: 1
  timeoutSeconds: 600
reproducibility:
  seed: 5
