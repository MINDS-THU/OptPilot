apiVersion: optpilot.io/v1
config: method
id: ga-weighted-rule-search-smoke
name: "Rule-weight search (quick check)"
description: Four-policy, one-generation GA configuration for integration smoke tests.
tags: [production, agv, baseline, ga, smoke, file-candidate, no-api]

entrypoint:
  python: method:EvolutionaryRuleSearchMethod
  pythonPath: [.]
  protocol: batch

settings:
  batchSize: 4
  algorithm: ga
  seed: 42
  smokeMode: true
  populationSize: 4
  generations: 1
  stabilityLambda: 0.35
  crossoverProbability: 0.9
  crossoverEta: 15.0
  crossoverVariableProbability: 0.5
  mutationProbability: 0.25
  mutationEta: 20.0

accepts:
  formats: [files]
  requires:
    context:
      - candidate.files.editable
      - candidate.files.allow
