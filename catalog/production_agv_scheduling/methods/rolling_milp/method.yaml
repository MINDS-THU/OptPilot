apiVersion: optpilot.io/v1
config: method
id: rolling-milp-baselines
description: Stages the monolithic and two-stage rolling-horizon Gurobi policies from the paper.
tags: [baseline, scheduling, milp, files, gurobi]

entrypoint:
  python: method:RollingMILPMethod
  pythonPath: [.]
  protocol: batch

settings:
  batchSize: 2
  variants: [monolithic, two_stage]
  solverTimeLimitSeconds: 2.0
  minReplanIntervalMinutes: 8.0
  simulationStepMinutes: 0.5
  maxMipTasks: 120
  maxRawProducts: 24
  maxFutureTasks: 24
  futureHorizonMinutes: 120.0
  acceptPartialSolution: false
  fallbackMode: heuristic
  adaptiveMinMipTasks: 48
  adaptiveMaxMipTasks: 200

accepts:
  formats: [files]
  requires:
    context:
      - candidate.files.allow
