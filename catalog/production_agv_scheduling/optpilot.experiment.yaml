tasks:
- id: scheduling
  name: Factory scheduling
  environment: factory
  evaluator: environments/production_agv_scheduling/grade_versioned.py:evaluate
  parameters:
    simulation_horizon: {valueType: float, title: Simulation horizon, unit: min, min: 11, max: 500, default: 30.0}
    time_step: {valueType: float, title: Decision interval, unit: min, min: 0.1, max: 10, default: 0.5}
    disable_faults: {valueType: bool, title: Disable equipment faults, default: true}
  environmentParameters:
    simulation_horizon: simulation_horizon
    time_step: time_step
    disable_faults: disable_faults
  decisionContract:
    format: program
    description: 'decide(operation, snapshot=None): reset state or return scheduling
      commands for a public snapshot.'
  metrics:
  - total_score
  - mean_total_score
  - std_total_score
  - min_total_score
  - max_total_score
  - stability_fitness
  - worst_seed
  - worst_total_score
  - replication_count
  - mean_efficiency_score
  - mean_quality_cost_score
  - mean_agv_score
  - mean_order_completion
  - mean_production_cycle
  - mean_device_utilization
  - mean_first_pass_rate
  - mean_cost_efficiency
  - mean_charge_strategy
  - mean_energy_efficiency
  - mean_utilization
  - mean_policy_fallback_replans
  - policy_fallback_replication_count
instances:
- id: short-shift
  name: Short shift
  task: scheduling
- id: shift-with-faults
  name: Shift with equipment faults
  task: scheduling
  parameters: {simulation_horizon: 180.0, disable_faults: false}
suites:
- id: smoke
  instances:
  - short-shift
candidates:
- id: baseline
  format: program
  entrypoint: environments/production_agv_scheduling/policy_endpoint.py:decide
  files:
  - environments/production_agv_scheduling/initial/scheduler.py
  - environments/production_agv_scheduling/initial/param_estimator.py
studies:
- id: smoke
  suiteIds:
  - smoke
  candidateIds:
  - baseline
  metric: total_score
  timeoutSeconds: 180
