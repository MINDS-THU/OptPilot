apiVersion: optpilot.io/v1
config: study
name: production-agv-process-aware-llm
description: Paper-style baseline plus up to five four-candidate process-aware LLM improvement rounds.
tags: [production, agv, llm, heuristic-design, files]

environmentConfig: ../environments/production_agv_scheduling/environment_llm.yaml
methodConfig: ../methods/process_aware_llm/method.yaml

objective:
  metric: mean_total_score
  direction: maximize
  secondaryMetrics: [std_total_score, min_total_score, max_total_score, mean_efficiency_score, mean_quality_cost_score, mean_agv_score]

budget:
  # One initial policy plus five complete four-candidate improvement rounds.
  maxTrials: 21

execution:
  # Evaluate up to three sibling revisions concurrently. The method can emit
  # four candidates in one round; the fourth starts as soon as capacity frees.
  parallelism: 3
  timeoutSeconds: 1800

evidence:
  level: full

reproducibility:
  seed: 42
