apiVersion: optpilot.io/v1
config: study
name: production-agv-scheduling-parallel-smoke
description: Four deterministic GA candidates evaluated at paper-default scale to prove three-way evaluator concurrency.
tags: [production, agv, smoke, parallelism, files]

environmentConfig: ../environments/production_agv_scheduling/environment_llm.yaml
methodConfig: ../methods/evolutionary_rule_search/method_smoke.yaml

objective:
  metric: stability_fitness
  direction: maximize
  secondaryMetrics: [mean_total_score, std_total_score]

budget:
  maxTrials: 4

execution:
  parallelism: 3
  timeoutSeconds: 1800

evidence:
  level: full

reproducibility:
  seed: 42
