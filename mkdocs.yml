site_name: OptPilot
site_url: https://minds-thu.github.io/OptPilot/reference/
site_description: Inspectable experiments for iterative optimization, with frozen evaluation conditions and retained results.
site_author: OptPilot contributors

repo_name: MINDS-THU/OptPilot
repo_url: https://github.com/MINDS-THU/OptPilot
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Install OptPilot: installation.md
  - Tutorials:
      - Compare two search algorithms: getting-started.md
      - Run the comparison in Desktop: ui.md
      - Build a toy factory experiment: tutorial-package.md
      - Share a simulated colorimeter: resource-tutorial.md
  - How-to guides:
      - Run a candidate search: generate-and-optimize.md
      - Manage runs, resources and workers: operations.md
      - Run Harbor and import external results: external-results.md
  - Explanations:
      - The experiment model: concepts.md
      - What happens during a run: how-it-works.md
      - Choosing a runner: capabilities.md
      - Interpreting results and evidence: evidence.md
  - Reference:
      - Project manifest: configuration.md
      - Command-line interface: cli.md
      - Candidate contracts: candidate-contracts.md
      - Generator API: methods.md
  - Example projects:
      - Catalog: catalog.md
      - DEVS simulation studies: devs-gallery.md
      - Factory scheduling: llm-policy-search.md
      - COOPA solver reports: or-solving.md
  - Contributing: development.md

extra:
  generator: false

copyright: Apache License 2.0
