[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optpilot"
version = "0.2.0"
description = "An orchestrator for AI-assisted iterative optimization over measured objectives"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "OptPilot contributors"},
]
keywords = [
  "optimization",
  "experiments",
  "evaluation",
  "evidence",
  "benchmarking",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "jsonschema>=4",
  "PyYAML>=6.0",
  "referencing>=0.30",
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
examples = [
  "job-shop-lib>=1.7.0",
  "stable-baselines3>=2.3,<3",
]

[dependency-groups]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
examples = [
  "job-shop-lib>=1.7.0",
  "stable-baselines3>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/MINDS-THU/OptPilot"
Repository = "https://github.com/MINDS-THU/OptPilot.git"
Issues = "https://github.com/MINDS-THU/OptPilot/issues"

[project.scripts]
optpilot = "optpilot.cli:main"

[tool.setuptools]
# The example packages live at catalog/ in the repository, where the docs,
# tests and CI all reference them, and ship inside the install under a name
# that cannot collide with anything else. Mapping the directory keeps one
# copy: moving it under src/ would have rewritten 27 test modules, CI, and
# every documentation path for no gain.
package-dir = {"" = "src", "optpilot_examples" = "catalog"}
# Explicit rather than discovered, because a mapped directory cannot be
# discovered. test_release_packaging.py asserts this list stays complete, so
# a new subpackage cannot go missing from the distribution unnoticed.
packages = [
  "optpilot",
  "optpilot.realm",
  "optpilot.realm.migrations",
  "optpilot.schemas",
  "optpilot_examples",
]

[tool.setuptools.package-data]
"optpilot.schemas" = ["*.json", "defs/*.json"]
"optpilot.realm" = ["migrations/*.sql"]
# Everything the example packages are made of: settings, code, vendored
# wheels, data, notices. Anything omitted here is a package that installs
# broken, so this stays deliberately broad.
"optpilot_examples" = ["**/*"]

[tool.setuptools.exclude-package-data]
# Compiled bytecode from whoever last ran the tests is not part of a package.
"optpilot_examples" = ["**/__pycache__/**", "**/*.pyc", "**/.DS_Store"]

[tool.uv.workspace]
members = ["studio"]

[tool.uv.sources]
optpilot = { workspace = true }
