apiVersion: optpilot.io/v1
config: resource
id: devs-gen-interface-v3
name: DEVS Simulation Generator Interface v3
description: Natural-language interface for generating, checking, running, evaluating, and retaining xDEVS discrete-event simulation projects.
tasks:
  - generate-simulator
purpose: generator
tags:
  - resource
  - simulation
  - frontend
  - devs

actions:
  - id: generate
    label: Generate simulator bundle
    description: >-
      Headless batch generation: one written system specification in, one
      portable simulator bundle out (devs_project sources, run.py,
      devs.simulation.v2 manifest with declared metrics when the generated
      runner declares them, vendored runtime lock). The same pipeline the
      web interface drives, without the UI. Requires the configured
      generation model IDs and an OpenRouter API key.
    command: [python, headless_generate.py]
    inputs:
      specification:
        valueType: string
        description: Natural-language description of the system to generate.
      rootModelName:
        valueType: string
        default: GeneratedSystem
        pattern: "^[A-Za-z][A-Za-z0-9_]{0,63}$"
        description: Python-class-safe name for the root coupled model.
      thorough:
        valueType: bool
        default: false
        description: >-
          Also run the generator's internal verification stages. This does
          not enable an external automatic-check service.
    env:
      # Headless actions remain portable and do not require a host-side agent.
      # A deployment may explicitly configure an independent remote check.
      DEVS_HEADLESS_AUTOMATIC_CHECK: "0"
      DEVS_HEADLESS_AUTOMATIC_CHECK_TIMEOUT_SECONDS: "900"
      DEVS_COLLECTOR_SOURCE: devs-gen-interface-v3-headless
    grants:
      # Generation calls the configured model through OpenRouter, and setup
      # installs the dependency closure from PyPI.
      network: enabled
      envFromHost:
        # Model choices, not secrets. The package knows a working answer, so
        # only someone who wants a different model has to set these; anything
        # set in Studio Settings or exported still wins.
        - name: DEVS_INTERFACE_MODEL_ID
          default: openrouter/openai/gpt-5.4
          description: >-
            Model used for generating simulator projects, as a litellm model
            ID. OpenRouter models need the "openrouter/" prefix, e.g.
            "openrouter/moonshotai/kimi-k3" (bare IDs are auto-prefixed while
            the OpenRouter key is the granted credential).
        - name: DEVS_INTERFACE_STRONG_MODEL_ID
          default: openrouter/openai/gpt-5.4
          description: >-
            Model used for the harder generation passes, as a litellm model
            ID. OpenRouter models need the "openrouter/" prefix, e.g.
            "openrouter/moonshotai/kimi-k3" (bare IDs are auto-prefixed while
            the OpenRouter key is the granted credential).
        - name: DEVS_HEADLESS_COLLECTOR_URL
          default: ""
          description: Optional collector origin reachable from the host action.
        - name: DEVS_COLLECTOR_INGEST_TOKEN
          default: ""
          description: Optional collector credential; leave empty to disable collection.
      secretsFromHost: [OPENROUTER_API_KEY]
    runtime:
      sandbox: process
      setup:
        cache: prepared
        timeoutSeconds: 1800
        steps:
          # The generation pipeline imports smolagents, litellm, pydantic and
          # ~40 transitive packages. Their closure contains native wheels
          # (pydantic-core, aiohttp, tokenizers, numpy, scipy, pillow), so it
          # cannot be a vendored pure-wheel lock. Studio prepares the exact
          # venv once from the same requirements file the interface uses and
          # reuses it read-only instead of borrowing host site-packages.
          - uses: python-venv
            venv: .runtime/action-venv
            requirements: [requirements-interface.txt]
    timeoutSeconds: 3600

interface:
  label: DEVS Generator v3
  description: Launch the DEVS generation backend and graphical frontend, then open the Vite UI in Studio Preview.
  outputs:
    actions:
      - id: run-simulation
        label: Run simulation
        command:
          - bash
          - -lc
          - >-
            export OPTPILOT_SIMULATION_RESULTS_DIR="$OPTPILOT_OUTPUT_EXECUTION_RESULTS_ROOT";
            export DEVS_SIMULATION_RESULTS_DIR="$OPTPILOT_OUTPUT_EXECUTION_RESULTS_ROOT";
            exec "$OPTPILOT_PREPARED_RUNTIME_ROOT/python-venv/bin/python" -u run.py "$@"
          - optpilot-run
        cwd: .
        timeoutSeconds: 300
        acceptsArguments: true
        runtime: originating-interface
        # The embedded Run tab provides the student-facing controls. Keep this
        # action available to that interface without duplicating it above the UI.
        showInOutputCard: false
  command: [bash, -lc, ./_optpilot_launch_interface.sh]
  cwd: .
  env:
    # One managed OptPilot launch is one participant-visible session boundary.
    DEVS_DISPLAY_IDENTITY_MODE: launch
    DEVS_INTERFACE_CONCURRENCY: "8"
    DEVS_DISPLAY_MAX_ACTIVE_GENERATIONS: "3"
    DEVS_DISPLAY_GRAPH_PARSE_TIMEOUT_SECONDS: "240"
    DEVS_DISPLAY_GRAPH_PARSE_MAX_WORKERS: "6"
    DEVS_DISPLAY_AUTOMATIC_CHECK: "1"
    DEVS_DISPLAY_AUTOMATIC_CHECK_DRIVER: pi_cli
    DEVS_DISPLAY_AUTOMATIC_CHECK_MAX_ATTEMPTS: "1"
    DEVS_DISPLAY_AUTOMATIC_CHECK_TIMEOUT_SECONDS: "900"
    DEVS_DISPLAY_PI_PROVIDER: openrouter
    DEVS_DISPLAY_PI_MODEL: deepseek/deepseek-v4.1-flash
    DEVS_DISPLAY_PI_THINKING: "off"
    DEVS_COLLECTOR_SOURCE: devs-gen-interface-v3
    # Standalone launches use this no-network container fallback. Managed
    # Studio launches use the run-simulation action in the originating
    # prepared runtime. Generated Python never runs in the credential-bearing
    # interface process.
    DEVS_GENERATED_EXECUTION_MODE: container
    DEVS_GENERATED_EXECUTION_IMAGE: optpilot/workspace-dev:code-server-4.137.0-node-22.19.0-uv-0.12.15
  runtime:
    sandbox: process
    setup:
      cache: prepared
      timeoutSeconds: 1800
      steps:
        - uses: command
          command: [bash, ./_optpilot_launch_interface.sh, --prepare-only]
  grants:
    network: enabled
    envFromHost:
      # Model choices, not secrets -- see the note on the action above.
      - name: DEVS_INTERFACE_MODEL_ID
        default: openrouter/openai/gpt-5.4
        description: >-
          Model used for generating simulator projects, as a litellm model
          ID. OpenRouter models need the "openrouter/" prefix, e.g.
          "openrouter/moonshotai/kimi-k3" (bare IDs are auto-prefixed while
          the OpenRouter key is the granted credential).
      - name: DEVS_INTERFACE_STRONG_MODEL_ID
        default: openrouter/openai/gpt-5.4
        description: >-
          Model used for the harder generation passes, as a litellm model
          ID. OpenRouter models need the "openrouter/" prefix, e.g.
          "openrouter/moonshotai/kimi-k3" (bare IDs are auto-prefixed while
          the OpenRouter key is the granted credential).
      - name: DEVS_DISPLAY_MODEL_ID
        default: openrouter/openai/gpt-5.4
        description: >-
          Model used for explaining and visualising a project, as a litellm
          model ID. OpenRouter models need the "openrouter/" prefix, e.g.
          "openrouter/moonshotai/kimi-k3" (bare IDs are auto-prefixed while
          the OpenRouter key is the granted credential).
      - name: DEVS_COLLECTOR_URL
        default: ""
        description: Optional durable-session collector origin.
      - name: DEVS_COLLECTOR_INGEST_TOKEN
        default: ""
        description: Optional collector credential; leave empty to disable collection.
    secretsFromHost:
      - OPENROUTER_API_KEY
  resources:
    cpu: 2
    memoryMiB: 4096
    gpus: 0
  timeoutSeconds: 3600
  presentation:
    kind: web
    port: 3000
    extraPorts: [8000]
    readyPath: /
    readyTimeoutSeconds: 420
  accepts:
    selectionKinds: [workspace]
    mediaTypes: []
